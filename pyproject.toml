[project]
name = "piazza-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.2",
    "markdownify>=1.2.2",
    "piazza-api>=0.15.0",
    "pypdf>=6.13.2",
]

[project.scripts]
piazza-mcp = "piazza_mcp:main"
piazza = "piazza_mcp.cli:run"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
